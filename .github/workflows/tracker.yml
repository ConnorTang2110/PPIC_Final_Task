name: GitHub Projects Automation

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: read
  issues: read

jobs:
  move-issue-to-done:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move linked issue to Done
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_ID: PVT_kwHODVHdY84Bpku4
          STATUS_FIELD_ID: PVTSSF_lAHODVHdY84Bpku4zhn_wD0
          DONE_OPTION_ID: "98236657"
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

        run: |
          echo "Finding issues linked to pull request #$PR_NUMBER..."

          ISSUE_IDS=$(gh api graphql -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  closingIssuesReferences(first: 20) {
                    nodes {
                      id
                      number
                    }
                  }
                }
              }
            }' \
            -F owner="$REPO_OWNER" \
            -F name="$REPO_NAME" \
            -F number="$PR_NUMBER" \
            --jq '.data.repository.pullRequest.closingIssuesReferences.nodes[].id')

          if [ -z "$ISSUE_IDS" ]; then
            echo "No linked issues found."
            exit 0
          fi

          while IFS= read -r ISSUE_ID; do
            echo "Adding issue to project..."

            ITEM_ID=$(gh api graphql -f query='
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) {
                  item {
                    id
                  }
                }
              }' \
              -F projectId="$PROJECT_ID" \
              -F contentId="$ISSUE_ID" \
              --jq '.data.addProjectV2ItemById.item.id')

            echo "Moving issue to Done..."

            gh api graphql -f query='
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: {
                    singleSelectOptionId: $optionId
                  }
                }) {
                  projectV2Item {
                    id
                  }
                }
              }' \
              -F projectId="$PROJECT_ID" \
              -F itemId="$ITEM_ID" \
              -F fieldId="$STATUS_FIELD_ID" \
              -F optionId="$DONE_OPTION_ID"

            echo "Issue successfully moved to Done!"

          done <<< "$ISSUE_IDS"
